name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: neomnix
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: neomnix
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U neomnix" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock pip-audit
      - run: pytest -q
      - run: python -m compileall -q src
      - run: bandit -r src -q
      - run: pip-audit -r requirements.lock
      - run: alembic upgrade head && alembic current
        env:
          DATABASE_URL: postgresql://neomnix:ci-only-password@localhost:5432/neomnix
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile.prod backend
      - run: docker build frontend
