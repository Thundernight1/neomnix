name: Neomnix Manual Validate

on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate Dockerfile
      run: |
        docker build -f backend/Dockerfile --dry-run ./backend || true
        docker build -f frontend/Dockerfile --dry-run ./frontend || true
    
    - name: Validate docker compose
      run: docker compose config > /dev/null
    
    - name: ✅ All checks passed
      run: echo "Pipeline validated"
