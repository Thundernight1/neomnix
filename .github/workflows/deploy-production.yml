name: CyberSurX GRC - Deploy to Production

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_run:
    workflows: ["CyberSurX GRC - Full CI/CD Pipeline"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_strategy:
        description: 'Deployment strategy'
        required: true
        default: 'rolling'
        type: choice
        options:
          - rolling
          - blue-green
          - canary

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # VERIFY: Pre-deployment checks
  # ==========================================
  pre-deployment-checks:
    name: Pre-deployment Verification
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    outputs:
      build_status: ${{ steps.status.outputs.build_status }}
      
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify Git Status
      id: status
      run: |
        echo "build_status=ready" >> $GITHUB_OUTPUT
        echo "✅ Pre-deployment checks passed"
        echo "Commit: ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"
        
    - name: Download Latest Test Artifacts
      uses: actions/download-artifact@v3
      with:
        name: backend-test-results
        continue-on-error: true
        
    - name: Verify Test Compliance
      run: |
        if [ -f test-results.xml ]; then
          echo "✅ Test results found"
        else
          echo "⚠️ No test results found (continuing anyway)"
        fi

  # ==========================================
  # BUILD: Create production images
  # ==========================================
  build-production:
    name: Build Production Images
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    permissions:
      contents: read
      packages: write
    
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
    
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=sha,prefix=${{ matrix.service }}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v4
      with:
        context: ./${{ matrix.service }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_ENV=production
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          VCS_REF=${{ github.sha }}
          
    - name: Output Image Names
      id: images
      run: |
        if [ "${{ matrix.service }}" = "backend" ]; then
          echo "backend_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}" >> $GITHUB_OUTPUT
        else
          echo "frontend_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}" >> $GITHUB_OUTPUT
        fi

  # ==========================================
  # DEPLOY: Production Deployment
  # ==========================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-production
    environment:
      name: production
      url: https://cybersurx.io
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials (if using ECS)
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
      continue-on-error: true
    
    - name: Deploy via SSH (Docker Compose)
      env:
        PROD_HOST: ${{ secrets.PROD_HOST }}
        PROD_USER: ${{ secrets.PROD_USER }}
        PROD_KEY: ${{ secrets.PROD_SSH_KEY }}
        BACKEND_IMAGE: ${{ needs.build-production.outputs.backend_image }}
        FRONTEND_IMAGE: ${{ needs.build-production.outputs.frontend_image }}
      run: |
        mkdir -p ~/.ssh
        echo "$PROD_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
        
        ssh $PROD_USER@$PROD_HOST << 'DEPLOY_SCRIPT'
        set -e
        cd /opt/cybersurx
        
        # Backup current state
        docker compose -f docker-compose.yml config > backup-compose-$(date +%s).yml
        
        # Update images
        export BACKEND_IMAGE="${BACKEND_IMAGE}"
        export FRONTEND_IMAGE="${FRONTEND_IMAGE}"
        
        echo "🔄 Pulling latest images..."
        docker compose -f docker-compose.yml pull
        
        echo "🔄 Starting new containers..."
        docker compose -f docker-compose.yml up -d --no-deps --build api frontend worker
        
        echo "⏳ Waiting for health checks..."
        sleep 10
        docker compose -f docker-compose.yml exec -T api curl -f http://localhost:8000/health || exit 1
        
        echo "🧹 Cleaning up old images..."
        docker image prune -f --filter "dangling=true"
        
        DEPLOY_SCRIPT
        
    - name: Create Deployment Record
      run: |
        cat > deployment-record-${{ github.run_id }}.md << EOF
        # Production Deployment Record
        
        **Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')
        **Commit:** ${{ github.sha }}
        **Author:** ${{ github.actor }}
        **Branch:** ${{ github.ref }}
        **Deployment Strategy:** ${{ github.event.inputs.deployment_strategy || 'rolling' }}
        
        ## Images Deployed
        - Backend: ${{ needs.build-production.outputs.backend_image }}
        - Frontend: ${{ needs.build-production.outputs.frontend_image }}
        
        ## Status
        ✅ Deployment completed successfully
        EOF
        
    - name: Upload Deployment Record
      uses: actions/upload-artifact@v3
      with:
        name: deployment-record
        path: deployment-record-${{ github.run_id }}.md
        retention-days: 90

  # ==========================================
  # VERIFY: Post-deployment checks
  # ==========================================
  post-deployment-checks:
    name: Post-deployment Verification
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Health Check - API
      run: |
        max_attempts=30
        attempt=0
        while [ $attempt -lt $max_attempts ]; do
          if curl -f https://cybersurx.io/api/health 2>/dev/null; then
            echo "✅ API health check passed"
            exit 0
          fi
          attempt=$((attempt + 1))
          echo "Attempt $attempt/$max_attempts..."
          sleep 5
        done
        exit 1
        
    - name: Health Check - Frontend
      run: |
        curl -f https://cybersurx.io -o /dev/null -w "HTTP Status: %{http_code}\n" || exit 1
        echo "✅ Frontend health check passed"
        
    - name: Generate Deployment Summary
      if: always()
      run: |
        echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
        echo "**Deployed by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### URLs" >> $GITHUB_STEP_SUMMARY
        echo "- Application: https://cybersurx.io" >> $GITHUB_STEP_SUMMARY
        echo "- API Docs: https://cybersurx.io/api/docs" >> $GITHUB_STEP_SUMMARY
        
    - name: Slack Notification
      if: success()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "✅ Production Deployment Successful",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Production Deployment Successful*\n\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nTime: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
                }
              }
            ]
          }
      continue-on-error: true

  # ==========================================
  # ROLLBACK: Emergency rollback capability
  # ==========================================
  rollback-if-failed:
    name: Automatic Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deployment-checks]
    if: failure()
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Rollback to Previous Version
      env:
        PROD_HOST: ${{ secrets.PROD_HOST }}
        PROD_USER: ${{ secrets.PROD_USER }}
        PROD_KEY: ${{ secrets.PROD_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$PROD_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $PROD_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
        
        ssh $PROD_USER@$PROD_HOST << 'ROLLBACK_SCRIPT'
        cd /opt/cybersurx
        
        echo "⏮️ Rolling back to previous version..."
        
        # Find latest backup
        LATEST_BACKUP=$(ls -t backup-compose-*.yml 2>/dev/null | head -1)
        
        if [ -z "$LATEST_BACKUP" ]; then
          echo "❌ No backup found. Manual intervention required."
          exit 1
        fi
        
        echo "Using backup: $LATEST_BACKUP"
        docker compose -f "$LATEST_BACKUP" pull
        docker compose -f "$LATEST_BACKUP" up -d
        
        echo "✅ Rollback completed"
        ROLLBACK_SCRIPT
        
    - name: Notify Rollback
      if: always()
      uses: slackapi/slack-github-action@v1.24.0
      with:
        webhook-url: ${{ secrets.SLACK_WEBHOOK }}
        payload: |
          {
            "text": "⚠️ Deployment Failed - Automatic Rollback Triggered",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*Deployment Failed - Automatic Rollback*\n\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}\nAction: Check workflow logs"
                }
              }
            ]
          }
      continue-on-error: true
