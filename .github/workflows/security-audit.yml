name: CyberSurX GRC - Scheduled Security Audit

on:
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  # ==========================================
  # SECURITY: Deep Vulnerability Scan
  # ==========================================
  deep-security-scan:
    name: Deep Vulnerability Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Run Trivy - Filesystem Scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'json'
        output: 'trivy-fs-results.json'
        severity: 'CRITICAL,HIGH,MEDIUM'
        
    - name: Run Trivy - Config Audit
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: '.'
        format: 'json'
        output: 'trivy-config-results.json'
        
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
        
    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt bandit safety
        
    - name: Run Bandit - Python Security Audit
      continue-on-error: true
      run: |
        cd backend
        bandit -r src -f json -o bandit-results.json || true
        
    - name: Check Python Dependencies for Known Vulnerabilities
      continue-on-error: true
      run: |
        cd backend
        safety check --json > safety-results.json || true
        
    - name: Upload All Security Results
      uses: actions/upload-artifact@v3
      with:
        name: security-audit-results
        path: |
          trivy-fs-results.json
          trivy-config-results.json
          backend/bandit-results.json
          backend/safety-results.json
        retention-days: 90
        
    - name: Generate Security Report
      if: always()
      run: |
        echo "# Security Audit Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Scan Date:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Trivy Filesystem Scan: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Trivy Config Audit: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Bandit Python Security: ✅" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency Check: ✅" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See artifacts for detailed results." >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # DEPENDENCY: Check for Updates
  # ==========================================
  dependency-check:
    name: Check Dependency Updates
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check Backend Dependencies (pip-audit)
      continue-on-error: true
      run: |
        pip install pip-audit
        cd backend
        pip-audit || true
        
    - name: Check Frontend Dependencies (npm audit)
      continue-on-error: true
      working-directory: frontend
      run: npm audit --production || true
        
    - name: Create Issue for Vulnerabilities
      if: failure()
      uses: actions/create-issue@v2
      with:
        title: "🔒 Security: Dependency Vulnerabilities Found"
        body: |
          Security audit detected vulnerabilities in dependencies.
          
          **Workflow:** Scheduled Security Audit
          **Time:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          Please review the audit results and update dependencies.
