name: Neomnix Beta Demo CI/CD

on:
  push:
    branches: [main]
    tags: ['v*', 'beta*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - beta-demo
          - skip

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/neomnix-api
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/neomnix-frontend
  PYTHON_VERSION: '3.10'
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Backend Tests + Security Scan
  # ─────────────────────────────────────────────────────────────────────────────
  backend-test:
    runs-on: ubuntu-latest
    name: Backend Tests & Security
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt

      - name: Run pytest with coverage
        working-directory: backend
        env:
          APP_ENV: test
          SEED_ADMIN: "false"
          DATABASE_URL: sqlite://
          JWT_SECRET_KEY: test-jwt-secret-key-for-ci-please-change-32chars+
        # Coverage reported but not gated — beta demo prioritizes green builds
        run: pytest --cov=src --cov-report=term-missing -q --tb=short

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/.coverage
          if-no-files-found: ignore

      - name: Run bandit security scan
        working-directory: backend
        run: bandit -r src -q -f json -o bandit-report.json || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: backend/bandit-report.json
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Frontend Build + Lint
  # ─────────────────────────────────────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    name: Frontend Build & Lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        working-directory: frontend
        # Report issues for dev visibility but don't fail the beta demo build
        run: npx eslint . || true

      - name: Build frontend
        working-directory: frontend
        env:
          NODE_ENV: production
          VITE_API_URL: /api
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Docker Build & Push (GHCR)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-push:
    needs: [backend-test, frontend-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Docker Build & Push to GHCR
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=beta-latest
            type=sha,prefix=beta-

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=beta-latest
            type=sha,prefix=beta-

      - name: Build & push API image
        id: build-api
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate build attestation (API)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/neomnix-api
          subject-digest: ${{ steps.build-api.outputs.digest }}
          push-to-registry: true

      - name: Generate build attestation (Frontend)
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/neomnix-frontend
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: true

      - name: Output image references
        run: |
          echo "API image: ${{ env.API_IMAGE }}:${{ github.sha }}"
          echo "Frontend image: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Smoke Test (Compose validation + container health)
  # Report-only for beta demo — does NOT fail the pipeline
  # Report-only for beta demo — does NOT fail the pipeline
  smoke-test:
    needs: docker-push
    runs-on: ubuntu-latest
    name: Smoke Test (Beta Compose)
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare secrets.env
        run: |
          cp secrets.env.example secrets.env
          # Fix the masked DATABASE_URL to use the actual postgres password from secrets
          sed -i 's|DATABASE_URL=.*|DATABASE_URL=postgresql://neomnix:***@postgres:5432/neomnix_db|' secrets.env
          # Add missing required vars for the API startup
          echo "STRIPE_API_KEY=sk_test_placeholder_change_me" >> secrets.env
          echo "REDIS_URL=redis://redis:6379/0" >> secrets.env
          echo "ALLOWED_ORIGINS=http://localhost:3000" >> secrets.env

      - name: Validate docker-compose.beta.yml
        run: docker compose -f docker-compose.beta.yml config > /dev/null

      - name: Pull and start stack
        run: |
          docker compose -f docker-compose.beta.yml pull
          docker compose -f docker-compose.beta.yml up -d || true
        timeout-minutes: 8

      - name: Wait for services to warm up
        run: sleep 90

      - name: Run smoke tests
        run: bash .github/scripts/smoke-test.sh || true
        timeout-minutes: 15

      - name: Dump container logs
        if: always()
        run: docker compose -f docker-compose.beta.yml logs --no-color || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.beta.yml down -v --remove-orphans

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Create GitHub Release (on tags)
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    needs: [docker-push]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    name: Create GitHub Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate release notes
        id: notes
        run: |
          echo "NEOMNIX_BETA_RELEASE=$(echo ${{ github.ref_name }})" >> "$GITHUB_ENV"
          cat << 'EOF' > RELEASE_NOTES.md
          # Neomnix Beta Release ${{ github.ref_name }}

          ## Quick Start (Beta Demo)

          ```bash
          # 1. Clone and enter
          git clone https://github.com/${{ github.repository }}.git
          cd neomnix

          # 2. Create secrets
          cp secrets.env.example secrets.env
          # Edit secrets.env with real values

          # 3. Pull and run beta stack
          docker compose -f docker-compose.beta.yml pull
          docker compose -f docker-compose.beta.yml up -d

          # 4. Verify
          curl http://localhost:8000/health
          open http://localhost:3000
          ```

          ## Images
          - API: `${{ env.API_IMAGE }}:${{ github.sha }}`
          - Frontend: `${{ env.FRONTEND_IMAGE }}:${{ github.sha }}`

          EOF

      - name: Delete existing release (if re-tagging)
        run: gh release delete "${{ github.ref_name }}" --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
