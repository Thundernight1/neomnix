name: Neomnix Deploy to Staging

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Prepare env file for compose validation
      run: |
        if [ -f secrets.env.example ]; then
          cp secrets.env.example secrets.env
        else
          printf '%s\n' "JWT_SECRET_KEY=test-jwt-secret-key-for-ci-please-change-32chars+" > secrets.env
        fi
    
    - name: Validate docker compose
      run: docker compose config > /dev/null
    
    - name: Build status check
      run: echo "✅ Build validation passed"
