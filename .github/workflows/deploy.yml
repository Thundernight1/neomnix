name: CyberSurX GRC - Deploy to Production

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_run:
    workflows: ["CyberSurX GRC - Full CI/CD Pipeline"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # DEPLOY: To Production Environment
  # ==========================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'push'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy Notification - Start
      run: |
        echo "🚀 Deployment started for commit ${{ github.sha }}"
        echo "Branch: ${{ github.ref }}"
        echo "Triggered by: ${{ github.actor }}"
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build & Push Backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build & Push Frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Create Deployment Manifest
      run: |
        cat > deployment-config.env << EOF
        BACKEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        FRONTEND_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
        DEPLOYMENT_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        COMMIT_SHA=${{ github.sha }}
        COMMIT_MESSAGE=${{ github.event.head_commit.message }}
        DEPLOYED_BY=${{ github.actor }}
        EOF
        
    - name: Upload Deployment Config
      uses: actions/upload-artifact@v3
      with:
        name: deployment-manifest
        path: deployment-config.env
        retention-days: 90
        
    - name: Deploy Notification - Success
      if: success()
      run: |
        echo "✅ Deployment completed successfully!"
        echo "Images tagged with commit: ${{ github.sha }}"
        
    - name: Deploy Notification - Failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        exit 1
