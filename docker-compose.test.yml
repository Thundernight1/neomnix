version: '3.9'

services:
  # API Service (FastAPI) - Test Mode
  api:
    container_name: aegis-api-test
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: >
      bash -c "
      pytest tests/ -v --tb=short --junit-xml=/app/test-results.xml &&
      uvicorn src.api.main:app --host 0.0.0.0 --port 8000
      "
    volumes:
      - ./backend:/app
      - ./backend/test-results.xml:/app/test-results.xml
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=sqlite:///./test.db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET_KEY=test-secret-key
      - OLLAMA_API_KEY=test-key
      - LLM_MODEL=test-model
      - ENVIRONMENT=test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Message Broker - Test Mode
  redis:
    container_name: aegis-redis-test
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Frontend - Build & Test
  frontend:
    container_name: aegis-frontend-test
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://api:8000
      - NODE_ENV=test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  test_data:

networks:
  default:
    name: aegis-test-network
