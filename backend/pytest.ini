[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require services)
    slow: Tests that take a long time to run
    asyncio: Tests that use async/await
    security: Security-related tests
    requires_zap: Tests that require OWASP ZAP
    requires_llm: Tests that require LLM API

# Output and reporting
addopts = 
    -ra
    --strict-markers
    --tb=short
    --disable-warnings

# Asyncio
asyncio_mode = auto

# Timeout for slow tests
timeout = 300

# Test paths
testpaths = tests

# Ignore patterns
norecursedirs = 
    .git
    .venv
    __pycache__
    node_modules
    dist
    build
