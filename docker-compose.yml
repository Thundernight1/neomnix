services:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. API Service (FastAPI + Uvicorn)
  # ──────────────────────────────────────────────────────────────────────────
  api:
    container_name: neomnix-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./secrets.env
    volumes:
      - ./backend:/app
      - reports_data:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      zap:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_API_KEY
      - LLM_API_BASE
      - LLM_MODEL
      - JWT_SECRET_KEY
      - JWT_EXPIRE_MINUTES
      - ADMIN_EMAIL
      - ADMIN_DEFAULT_PASSWORD
      - ALLOWED_ORIGINS
      - SEED_ADMIN
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Worker Service (Celery)
  # ──────────────────────────────────────────────────────────────────────────
  worker:
    container_name: neomnix-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A src.worker.tasks worker --loglevel=info --concurrency=2
    env_file:
      - ./secrets.env
    volumes:
      - ./backend:/app
      - reports_data:/app/reports
    depends_on:
      redis:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      - DATABASE_URL
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_API_KEY
      - LLM_API_BASE
      - LLM_MODEL
      - ZAP_HOST=zap
      - ZAP_PORT=8080
      - ZAP_API_KEY
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Message Broker (Redis)
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    container_name: neomnix-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Security Tool: OWASP ZAP (Active Scanner)
  # ──────────────────────────────────────────────────────────────────────────
  zap:
    container_name: neomnix-zap
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=$$ZAP_API_KEY
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    restart: unless-stopped

  test-telnet:
    container_name: neomnix-test-telnet
    image: alpine:3.20
    command: sh -lc "apk add --no-cache busybox-extras && telnetd -F -p 23"
    profiles: ["test"]
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Frontend Service (React + Nginx)
  #
  # White-label branding: theme.json is volume-mounted from the project root
  # into the Nginx HTML directory. Edit theme.json and run:
  #   docker compose restart frontend
  # to apply changes without rebuilding the image.
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    container_name: neomnix-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      # Mount theme.json as a runtime-configurable static file
      - ./theme.json:/usr/share/nginx/html/theme.json:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 6. PostgreSQL Database (Homebrew managed on host, but exposed for Docker)
  # ──────────────────────────────────────────────────────────────────────────
  postgres:
    container_name: neomnix-postgres
    image: postgres:17-alpine
    env_file:
      - ./secrets.env
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  reports_data:
    driver: local
  postgres_data:
    driver: local
