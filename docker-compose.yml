services:

  # ──────────────────────────────────────────────────────────────────────────
  # 1. API Service (FastAPI + Uvicorn)
  # ──────────────────────────────────────────────────────────────────────────
  api:
    container_name: aegis-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - reports_data:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./cybersurx.db}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://ollama.com/api}
      - LLM_MODEL=${LLM_MODEL:-qwen3-coder:480b-cloud}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-480}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@cybersurx.io}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-CyberSurX2026!}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Worker Service (Celery)
  # ──────────────────────────────────────────────────────────────────────────
  worker:
    container_name: aegis-worker
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A src.worker.tasks worker --loglevel=info --concurrency=2
    volumes:
      - ./backend:/app
      - reports_data:/app/reports
    depends_on:
      redis:
        condition: service_healthy
      zap:
        condition: service_started
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./cybersurx.db}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_API_KEY=${OLLAMA_API_KEY}
      - LLM_API_BASE=${LLM_API_BASE:-https://ollama.com/api}
      - LLM_MODEL=${LLM_MODEL:-qwen3-coder:480b-cloud}
      - ZAP_HOST=zap
      - ZAP_API_KEY=${ZAP_API_KEY:-aegis-zap-secret}
    cap_add:
      - NET_ADMIN
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Message Broker (Redis)
  # ──────────────────────────────────────────────────────────────────────────
  redis:
    container_name: aegis-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Security Tool: OWASP ZAP (Active Scanner)
  # ──────────────────────────────────────────────────────────────────────────
  zap:
    container_name: aegis-zap
    image: ghcr.io/zaproxy/zaproxy:stable
    command: >
      zap.sh -daemon -host 0.0.0.0 -port 8080
      -config api.key=${ZAP_API_KEY:-aegis-zap-secret}
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────────
  # 5. Frontend Service (React + Nginx)
  #
  # White-label branding: theme.json is volume-mounted from the project root
  # into the Nginx HTML directory. Edit theme.json and run:
  #   docker compose restart frontend
  # to apply changes without rebuilding the image.
  # ──────────────────────────────────────────────────────────────────────────
  frontend:
    container_name: aegis-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      # Mount theme.json as a runtime-configurable static file
      - ./theme.json:/usr/share/nginx/html/theme.json:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reports_data:
    driver: local
